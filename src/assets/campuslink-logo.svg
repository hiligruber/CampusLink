<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d8a5c"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d8a5c"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d8a5c"/>
    </linearGradient>
  </defs>

  <!-- Globe -->
  <circle cx="60" cy="60" r="34" fill="url(#globeGrad)"/>

  <!-- Continents (simplified) -->
  <path d="M40 50 Q47 44 55 48 Q62 52 58 60 Q52 65 45 62 Q40 58 40 50 Z" fill="#ffffff" opacity="0.92"/>
  <path d="M68 52 Q76 50 80 56 Q82 64 75 68 Q70 70 67 64 Q66 58 68 52 Z" fill="#ffffff" opacity="0.92"/>
  <path d="M50 72 Q58 70 64 74 Q68 80 62 82 Q54 82 50 78 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Meridian -->
  <ellipse cx="60" cy="60" rx="14" ry="34" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.55"/>
  <!-- Equator -->
  <line x1="26" y1="60" x2="94" y2="60" stroke="#ffffff" stroke-width="1.2" opacity="0.55"/>

  <!-- Orbit / travel path -->
  <ellipse cx="60" cy="60" rx="52" ry="20" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-linecap="round" transform="rotate(-25 60 60)" stroke-dasharray="4 6"/>

  <!-- Travel marker (pin/plane dot) on orbit -->
  <circle cx="108" cy="46" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <circle cx="14" cy="76" r="3.5" fill="#0d8a5c" stroke="#ffffff" stroke-width="1.5"/>
</svg>
