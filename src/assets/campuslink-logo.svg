<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d8a5c"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="url(#greenGrad)" />
  <!-- Connected nodes forming a campus / ride-share abstract -->
  <circle cx="50" cy="28" r="8" fill="white"/>
  <circle cx="28" cy="62" r="6" fill="white" opacity="0.9"/>
  <circle cx="72" cy="62" r="6" fill="white" opacity="0.9"/>
  <!-- Connecting lines -->
  <line x1="50" y1="36" x2="28" y2="56" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="72" y2="56" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="34" y1="62" x2="66" y2="62" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
</svg>